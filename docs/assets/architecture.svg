<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="716" viewBox="0 0 1120 716" role="img" aria-labelledby="title description">
  <title id="title">Where Sweep runs</title>
  <desc id="description">Proposed Sweep architecture. Google renders the Gmail interface and sends HTTPS actions to Sweep's Python API on Modal. The API saves jobs in Google Firestore and submits a discovery controller. The controller finds unread Gmail messages, freezes their order, and starts the model worker. The worker loads Laya from a private Modal Volume, archives or trashes one email at a time, marks successful emails read, and saves results in Firestore. Sweep's application is MIT open source; production data and secrets remain private.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#c6ccd5"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #f4f5f7; }
      .heading { font-size: 30px; font-weight: 600; }
      .legend { font-size: 17px; fill: #c6ccd5; }
      .node-title { font-size: 21px; font-weight: 600; }
      .node-detail { font-size: 17px; fill: #e4e7ec; }
      .edge { fill: none; stroke: #c6ccd5; stroke-width: 3; stroke-linejoin: round; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .edge-label { font-size: 16px; fill: #e4e7ec; paint-order: stroke; stroke: #17191c; stroke-width: 7px; stroke-linejoin: round; }
      .google { fill: #1b2433; stroke: #394353; stroke-width: 1.5; }
      .modal { fill: #2a281e; stroke: #494535; stroke-width: 1.5; }
      .note { font-size: 17px; fill: #b9c0cb; }
    </style>
  </defs>

  <rect width="1120" height="716" rx="16" fill="#17191c"/>
  <text x="24" y="46" class="heading">Where Sweep runs</text>
  <rect x="26" y="66" width="13" height="13" rx="3" fill="#4285f4"/>
  <text x="48" y="79" class="legend">Google</text>
  <rect x="138" y="66" width="13" height="13" rx="3" fill="#f5d75a"/>
  <text x="160" y="79" class="legend">Modal</text>
  <text x="266" y="79" class="legend">Selected design · implementation in progress</text>

  <!-- Connections are drawn before the components so labels remain unobstructed. -->
  <path class="edge both" d="M 266 174 H 413"/>
  <text x="340" y="157" text-anchor="middle" class="edge-label">HTTPS</text>

  <path class="edge" d="M 555 236 V 315"/>
  <text x="571" y="280" class="edge-label">submit job ID</text>

  <path class="edge both" d="M 697 174 H 781 V 347 H 843"/>
  <text x="780" y="155" text-anchor="middle" class="edge-label">save / read</text>

  <path class="edge" d="M 697 378 H 843"/>
  <text x="770" y="366" text-anchor="middle" class="edge-label">freeze IDs</text>

  <path class="edge both" d="M 413 378 H 326 V 556 H 266"/>
  <text x="314" y="461" text-anchor="middle" class="edge-label">find unread</text>

  <path class="edge" d="M 555 440 V 511"/>
  <text x="571" y="480" class="edge-label">start worker</text>

  <path class="edge both" d="M 413 600 H 266"/>
  <text x="340" y="624" text-anchor="middle" class="edge-label">Gmail API</text>

  <path class="edge both" d="M 697 554 H 751 V 410 H 843"/>
  <text x="753" y="481" text-anchor="middle" class="edge-label">checkpoint</text>

  <path class="edge" d="M 843 604 H 697"/>
  <text x="770" y="625" text-anchor="middle" class="edge-label">load model</text>

  <g aria-label="Gmail interface, hosted by Google">
    <rect x="24" y="118" width="236" height="112" rx="8" class="google"/>
    <rect x="25" y="129" width="5" height="90" rx="2" fill="#4285f4"/>
    <text x="41" y="150" class="node-title">Gmail interface</text>
    <text x="41" y="181" class="node-detail">Google renders controls</text>
    <text x="41" y="207" class="node-detail">Preferences · N · Sweep</text>
  </g>

  <g aria-label="Sweep Python API, hosted on Modal">
    <rect x="420" y="118" width="270" height="112" rx="8" class="modal"/>
    <rect x="421" y="129" width="5" height="90" rx="2" fill="#f5d75a"/>
    <text x="437" y="150" class="node-title">Our Python API</text>
    <text x="437" y="181" class="node-detail">Modal · small ready server</text>
    <text x="437" y="207" class="node-detail">FastAPI + Uvicorn</text>
  </g>

  <g aria-label="Job dispatch and selection on Modal">
    <rect x="420" y="322" width="270" height="112" rx="8" class="modal"/>
    <rect x="421" y="333" width="5" height="90" rx="2" fill="#f5d75a"/>
    <text x="437" y="354" class="node-title">Dispatch + selection</text>
    <text x="437" y="385" class="node-detail">Modal · queued Python</text>
    <text x="437" y="411" class="node-detail">Freeze newest-first IDs</text>
  </g>

  <g aria-label="Saved records in Google Firestore">
    <rect x="850" y="322" width="246" height="112" rx="8" class="google"/>
    <rect x="851" y="333" width="5" height="90" rx="2" fill="#4285f4"/>
    <text x="867" y="354" class="node-title">Saved records</text>
    <text x="867" y="385" class="node-detail">Google · Firestore</text>
    <text x="867" y="411" class="node-detail">Users · Jobs · Outcomes</text>
  </g>

  <g aria-label="The user's existing Gmail mailbox">
    <rect x="24" y="518" width="236" height="128" rx="8" class="google"/>
    <rect x="25" y="529" width="5" height="106" rx="2" fill="#4285f4"/>
    <text x="41" y="550" class="node-title">Gmail mailbox</text>
    <text x="41" y="581" class="node-detail">Google · user emails</text>
    <text x="41" y="607" class="node-detail">Read, archive or Trash</text>
    <text x="41" y="631" class="node-detail">Successful mail → read</text>
  </g>

  <g aria-label="Sequential model worker on Modal">
    <rect x="420" y="518" width="270" height="128" rx="8" class="modal"/>
    <rect x="421" y="529" width="5" height="106" rx="2" fill="#f5d75a"/>
    <text x="437" y="550" class="node-title">Worker + Laya</text>
    <text x="437" y="581" class="node-detail">Modal · Python + Laya</text>
    <text x="437" y="607" class="node-detail">One email at a time</text>
    <text x="437" y="631" class="node-detail">Archive or delete</text>
  </g>

  <g aria-label="Model files in a private Modal Volume">
    <rect x="850" y="518" width="246" height="128" rx="8" class="modal"/>
    <rect x="851" y="529" width="5" height="106" rx="2" fill="#f5d75a"/>
    <text x="867" y="550" class="node-title">Model files</text>
    <text x="867" y="581" class="node-detail">Modal · private Volume</text>
    <text x="867" y="607" class="node-detail">Weights + tokenizer</text>
    <text x="867" y="631" class="node-detail">Loaded once per worker</text>
  </g>

  <text x="24" y="691" class="note">MIT application · Private production data and secrets · Delete means recoverable Gmail Trash</text>
</svg>
